---
name: Update anime from Anilist, commit - push changes

on:
  schedule:
    # every day: the airing works
    - cron: '10 2 * * *'
      timezone: 'America/Bogota'
    # every monday, an hour after the daily update so their pushes don't collide: the current season
    - cron: '10 3 * * 1'
      timezone: 'America/Bogota'
  workflow_dispatch:
jobs:
  update_data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # the monday cron and manual runs fetch the season, the daily cron updates the airing works
    env:
      SEASON: ${{ github.event.schedule == '10 3 * * 1' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup virtual environment and run script
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

          if [ "$SEASON" = "true" ]; then
            python -m src.pipeline.fetch_season
          else
            chmod +x ./main.sh
            echo -e "\nn" | ./main.sh 5
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          today=$(date +"%Y-%m-%d")
          [ "$SEASON" = "true" ] && message="season update $today" || message="updated $today"

          git add .

          if ! git diff --cached  --quiet; then
            git commit -m "$message"
            git push
          else
            echo "Nothing new"
          fi
