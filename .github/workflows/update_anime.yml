---
name: Update anime from Anilist, commit - push changes

on:
  schedule:
    # every day: the airing works
    - cron: '10 2 * * *'
      timezone: 'America/Bogota'
    # every monday, an hour after the daily update so their pushes don't collide: the current season
    - cron: '10 3 * * 1'
      timezone: 'America/Bogota'
  workflow_dispatch:

# one run at a time: a run that starts while another is going waits for it instead of colliding on the push
concurrency:
  group: update-anime
  queue: max

jobs:
  update_data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # the monday cron fetches the season, the daily cron and manual runs update the airing works
    env:
      SEASON: ${{ github.event.schedule == '10 3 * * 1' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        # the latest main, not the commit from when the run was triggered, so a run that waited includes the previous push
        with:
          ref: main

      - name: Setup virtual environment and run script
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

          if [ "$SEASON" = "true" ]; then
            python -m src.pipeline.fetch_season
          else
            chmod +x ./main.sh
            # no input: the confirmation takes its default (yes) and the menu exits when the action ends
            ./main.sh 5 < /dev/null
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          today=$(date +"%Y-%m-%d")
          [ "$SEASON" = "true" ] && message="season update $today" || message="updated $today"

          git add .

          if ! git diff --cached  --quiet; then
            git commit -m "$message"
            git push
          else
            echo "Nothing new"
          fi
